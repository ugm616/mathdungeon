<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Crawler V2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>DUNGEON CRAWLER V2</h1>

    <div id="game-container">

        <canvas id="gameCanvas"
                width="640"
                height="480"></canvas>

        <div id="modal">

            <h2>FLOOR CLEARED</h2>

            <p>
                Spend 5 coins to spin for rewards
            </p>

            <div class="slots">

                <span id="slot1">🍒</span>
                <span id="slot2">🍒</span>
                <span id="slot3">🍒</span>

            </div>

            <button id="spinBtn">
                PULL LEVER (5 COINS)
            </button>

            <br><br>

            <button id="nextFloorBtn">
                DESCEND TO NEXT FLOOR
            </button>

        </div>

    </div>

    <div id="ui">

        <div id="strength">
            Strength: 20
        </div>

        <div id="coins">
            Coins: 0
        </div>

        <div id="keys">
            Keys: 0
        </div>

    </div>

    <div id="inventory">

        ⚡ Fury:
        <span id="inv-fury">1</span>

        &nbsp;&nbsp;

        ❤️ Potion:
        <span id="inv-potion">1</span>

        &nbsp;&nbsp;

        🛡 Shield:
        <span id="inv-shield">1</span>

        &nbsp;&nbsp;

        💣 Bomb:
        <span id="inv-bomb">1</span>

    </div>

    <div id="controls">

        <strong>Inventory Hotkeys</strong>

        <p>
            1 = Potion |
            2 = Fury |
            3 = Shield |
            4 = Bomb
        </p>

        <p>
            Move with WASD or Arrow Keys
        </p>

    </div>

    <div id="log">

        Welcome to the Dungeon...

    </div>

    <script src="game.js"></script>

</body>

</html>
